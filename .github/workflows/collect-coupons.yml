# クーポン収集ツールの定期実行ワークフロー
#
# - 毎日 日本時間(JST) 朝6時に実行(cron は UTC 指定のため 21:00 UTC = 翌日 06:00 JST)
# - workflow_dispatch により手動実行も可能
# - API キーは GitHub Secrets から渡す。未設定でも demo ソースのみで動作し失敗しない
name: クーポン収集

on:
  schedule:
    # UTC 21:00 = JST 06:00(日本時間 毎日朝6時)
    - cron: "0 21 * * *"
  workflow_dispatch:

# 最小権限: data/ をコミット・プッシュするために contents: write のみ付与
permissions:
  contents: write

# 同時実行の防止: 手動実行とスケジュール実行が重なった場合は後続を待機させる
# (キャンセルではなく待機にすることで、収集結果の取りこぼしを防ぐ)
concurrency:
  group: collect-coupons
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 暴走防止: ジョブ全体で15分を超えたら強制終了
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: クーポンを収集
        env:
          # Secrets 未設定の場合は空文字になり、該当ソースはスキップされる(エラーにならない)
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        run: python -m coupon_collector

      - name: データの変更をコミット・プッシュ
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "data/ に変更はありません。コミットをスキップします。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "クーポンデータ更新 (自動収集)"
          # 実行中に他のコミットが積まれていた場合に備えて rebase してからプッシュ
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
